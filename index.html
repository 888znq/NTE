<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    width: 100%;
    height: 100%;
    background: #000432;
    color: #ffffff;
    font-family: 'Roboto Mono', 'Courier New', monospace;
    overflow: hidden;
  }

  body {
    border: 1px solid #ffffff;
    display: flex;
    flex-direction: column;
  }

  /* ---------- Notes area (each line in its own bordered container) ---------- */
  .notes-list {
    flex: 1 1 auto;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    display: flex;
    flex-direction: column-reverse;
  }

  .notes-list::-webkit-scrollbar { width: 4px; }
  .notes-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.25); }

  .line-row {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      border: 1px solid #ffffff;
      padding: 8px 10px 8px 16px;
      flex: 0 0 auto;
      margin-bottom: -1px;
    }
  .notes-list .line-row:first-child {
    margin-bottom: 0;
  }

  .line-text {
      flex: 1 1 auto;
      min-width: 0;
      background: transparent;
      border: none;
      outline: none;
      resize: none;
      overflow: hidden;
      color: #ffffff;
      font-family: inherit;
      line-height: 1.4;
      font-size: clamp(11px, var(--note-font-size, 16px), 4.5vw);
      letter-spacing: 0.03em;
      padding: 2px 0;
    }

  .line-del {
    flex: 0 0 auto;
    background: transparent;
    border: none;
    color: rgba(255,255,255,0.45);
    font-size: 14px;
    line-height: 1;
    padding: 4px 8px;
    cursor: pointer;
  }
  .line-del:active { color: #ffffff; }

  /* ---------- Fixed blank input row (always at bottom) ---------- */
  .input-row {
    flex: 0 0 auto;
    display: flex;
    align-items: flex-start;
    gap: 6px;
    border-top: 1px solid #ffffff;
    padding: 8px 10px;
  }

  #inputText {
      flex: 1 1 auto;
      min-width: 0;
      background: transparent;
      border: none;
      outline: none;
      resize: none;
      overflow: hidden;
      color: #ffffff;
      font-family: inherit;
      line-height: 1.4;
      font-size: clamp(11px, var(--note-font-size, 16px), 4.5vw);
      letter-spacing: 0.03em;
      padding: 2px 0;
    }

  /* ---------- Bottom zoom slider ---------- */
  .zoom-bar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    border-top: 1px solid #ffffff;
  }

  .zoom-label {
      font-size: 16px;
      color: #ffffff;
      width: 18px;
      flex: 0 0 auto;
      text-align: center;
    }
  
    .input-row > span {
        flex: 0 0 auto;
        font-size: clamp(11px, var(--note-font-size, 16px), 4.5vw);
        line-height: 1.4;
        padding: 2px 0;
      }

  input[type="range"] {
    flex: 1 1 auto;
    -webkit-appearance: none;
    appearance: none;
    height: 2px;
    background: #ffffff;
    outline: none;
    border-radius: 2px;
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #ffffff;
    border: 1px solid #ffffff;
    cursor: pointer;
  }

  input[type="range"]::-moz-range-thumb {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #ffffff;
    border: 1px solid #ffffff;
    cursor: pointer;
  }

  input[type="range"]::-moz-range-track {
    height: 2px;
    background: #ffffff;
  }
/* ---------- Permanent on-screen keyboard ---------- */
  .kb {
    flex: 0 0 auto;
    border-top: 1px solid #ffffff;
    padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    gap: 6px;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  .kb-row {
    display: flex;
    gap: 4px;
    justify-content: center;
  }
  .kb-key {
    flex: 1 1 0;
    min-width: 0;
    height: var(--kb-key-h, 40px);
    background: transparent;
    border: 1px solid #ffffff;
    color: #ffffff;
    font-family: inherit;
    font-size: 16px;
    border-radius: 4px;
    padding: 0;
    cursor: pointer;
  }
  .kb-key:active { background: #ffffff; color: #000432; }
  .kb-key.kb-fn { flex: 1.5 1 0; }
  .kb-key.kb-space { flex: 5 1 0; }
  .kb-key.kb-on { background: #ffffff; color: #000432; }
    .kb { border-top: none; }
      .kb-divider {
        flex: 0 0 auto;
        position: relative;
        z-index: 2;
        height: 1px;
        background: #ffffff;
        cursor: row-resize;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }
      .kb-divider::before {
        content: '';
        position: absolute;
        left: 0;
        right: 0;
        top: -8px;
        bottom: -6px;
      }
      .kb-divider.kb-dragging { box-shadow: 0 0 0 1px #ffffff; }
        .kb { padding-top: 8px; }
        .kb-divider input[type="range"] {
          position: absolute;
          left: 0;
          right: 0;
          top: 50%;
          transform: translateY(-50%);
          width: 100%;
          height: 16px;
          margin: 0;
          background: transparent;
          pointer-events: none;
          z-index: 1;
        }
        .kb-divider input[type="range"]::-webkit-slider-thumb {
          width: 16px;
          height: 16px;
          pointer-events: auto;
          cursor: pointer;
        }
        .kb-divider input[type="range"]::-moz-range-thumb {
          width: 16px;
          height: 16px;
          pointer-events: auto;
          cursor: pointer;
        }
        .kb-divider input[type="range"]::-moz-range-track {
          background: transparent;
        }
</style>
</head>
<body>

  <div class="notes-list" id="notesList"></div>

  <div class="input-row">
    <span>•</span>
    <textarea id="inputText" rows="1" placeholder="" inputmode="none"></textarea>
  </div>

  <!-- zoom slider now lives inside the divider below -->

<div class="kb-divider" id="kbDivider">
    <input type="range" id="zoomSlider" min="12" max="36" value="16" step="1">
  </div>

  <div class="kb" id="kb"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAYHA8Qw3Qw3Qzbyg8MtjrSKcJusNi4VaA6V4",
    authDomain: "system-data-bf026.firebaseapp.com",
    databaseURL: "https://system-data-bf026-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "system-data-bf026",
    storageBucket: "system-data-bf026.firebasestorage.app",
    messagingSenderId: "718302899022",
    appId: "1:718302899022:web:f1675dbcc293e138c68c1f"
  };
  const fbApp = initializeApp(firebaseConfig);
  const db = getDatabase(fbApp);
  const NOTES_ID = "notes_1";
  const notesRef = ref(db, `textNotes/${NOTES_ID}`);
    var kbRef = ref(db, 'textNotes/' + NOTES_ID + '_kb');

  const STORAGE_KEY = 'notes_app_data_v1';
  const ZOOM_KEY = 'notes_app_zoom_v1';
  const BULLET = '•\u00A0';

  const notesList = document.getElementById('notesList');
  const inputText = document.getElementById('inputText');
  const zoomSlider = document.getElementById('zoomSlider');
    var kbEl = document.getElementById('kb');
    var kbShift = false;
    var kbSym = false;
    var kbTarget = null;

  let isRemoteUpdate = false;
    let isEditingNote = false;
    let localSaveTimeout = null;
    let remoteSyncTimeout = null;
    let lastSyncedText = null;
  
    function currentLinesFromDOM() {
      return [...notesList.querySelectorAll('.line-text')].map(r => r.value.replace(/^•\s*/, ''));
    }
  
    function loadNotesLocal() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return [];
      return raw.split('\n').filter(l => l.trim() !== '');
    }
  
    function scheduleSave() {
      clearTimeout(localSaveTimeout);
      localSaveTimeout = setTimeout(saveLocalOnly, 80);
  
      clearTimeout(remoteSyncTimeout);
      remoteSyncTimeout = setTimeout(syncRemote, 1200);
    }
  
    function saveLocalOnly() {
      const lines = currentLinesFromDOM();
      localStorage.setItem(STORAGE_KEY, lines.join('\n'));
    }
  
    function syncRemote() {
      const lines = currentLinesFromDOM();
      const text = lines.join('\n');
      if (text === lastSyncedText) return;
      lastSyncedText = text;
      try {
        set(notesRef, { lines: lines, ts: Date.now() });
      } catch (err) {
        console.error('sync failed', err);
      }
    }
  
    function listenRemote() {
      onValue(notesRef, (snap) => {
        const val = snap.val();
        if (!val || !Array.isArray(val.lines)) return;
        const incomingText = val.lines.join('\n');
        if (incomingText === lastSyncedText) return;
        lastSyncedText = incomingText;
        if (isEditingNote) return;
        const activeEl = document.activeElement;
        const isEditingInput = activeEl === inputText;
        isRemoteUpdate = true;
        renderNotes(val.lines);
        localStorage.setItem(STORAGE_KEY, val.lines.join('\n'));
        isRemoteUpdate = false;
        if (isEditingInput) inputText.focus();
      });
    }

  function loadZoom() {
    const z = localStorage.getItem(ZOOM_KEY);
    return z ? parseInt(z, 10) : 16;
  }

  function saveZoom(val) {
    localStorage.setItem(ZOOM_KEY, val);
  }

  function applyZoom(val) {
    document.documentElement.style.setProperty('--note-font-size', val + 'px');
  }

  function autoGrow(el) {
    el.style.height = 'auto';
    el.style.height = el.scrollHeight + 'px';
  }

  function createNoteRow(text) {
    const row = document.createElement('div');
    row.className = 'line-row';

    const textarea = document.createElement('textarea');
        textarea.className = 'line-text';
        textarea.value = BULLET + text.replace(/^•\s*/, '');
        textarea.rows = 1;
                textarea.setAttribute('inputmode', 'none');
    
        textarea.addEventListener('focus', () => {
              isEditingNote = true;
                            kbTarget = textarea;
            });
        
            textarea.addEventListener('blur', () => {
              isEditingNote = false;
              syncRemote();
            });
        
            textarea.addEventListener('input', () => {
              if (!textarea.value.startsWith(BULLET)) {
                const stripped = textarea.value.replace(/^[•\u00A0\s]*/, '');
                const caret = textarea.selectionStart;
                const removedLen = textarea.value.length - (BULLET.length + stripped.length);
                textarea.value = BULLET + stripped;
                const newCaret = Math.max(BULLET.length, caret - removedLen);
                textarea.setSelectionRange(newCaret, newCaret);
              }
              autoGrow(textarea);
              scheduleSave();
            });
        
            textarea.addEventListener('keydown', (e) => {
              const atBulletBoundary = textarea.selectionStart <= BULLET.length && textarea.selectionEnd <= BULLET.length;
              if (atBulletBoundary && (e.key === 'Backspace' || e.key === 'Delete')) {
                if (textarea.selectionStart === textarea.selectionEnd && textarea.selectionStart <= BULLET.length) {
                  e.preventDefault();
                }
              }
            });
        
            textarea.addEventListener('keydown', (e) => {
              if (e.key === 'Enter') {
                e.preventDefault();
                const newRow = createNoteRow('');
                row.insertAdjacentElement('afterend', newRow);
                const newTextarea = newRow.querySelector('.line-text');
                autoGrow(newTextarea);
                newTextarea.focus();
                scheduleSave();
              }
            });
    
        const del = document.createElement('button');
            del.className = 'line-del';
            del.textContent = '✕';
            del.addEventListener('click', () => {
              row.remove();
              scheduleSave();
            });
    
        row.appendChild(textarea);
        row.appendChild(del);
        return row;
      }

  function addNote(text) {
    if (text.trim() === '') return;
    const row = createNoteRow(text);
    notesList.appendChild(row);
    autoGrow(row.querySelector('.line-text'));
    scheduleSave();
    notesList.scrollTop = 0;
  }

  function renderNotes(lines) {
    notesList.innerHTML = '';
    lines.forEach(line => {
      const row = createNoteRow(line);
      notesList.appendChild(row);
    });
    notesList.querySelectorAll('.line-text').forEach(autoGrow);
    notesList.scrollTop = 0;
  }

  inputText.addEventListener('input', () => autoGrow(inputText));

  inputText.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      addNote(inputText.value);
      inputText.value = '';
      autoGrow(inputText);
      inputText.focus();
    }
  });

  zoomSlider.addEventListener('input', () => {
    applyZoom(zoomSlider.value);
    saveZoom(zoomSlider.value);
    notesList.querySelectorAll('.line-text').forEach(autoGrow);
    autoGrow(inputText);
  });

  // init
  renderNotes(loadNotesLocal());
  const initialZoom = loadZoom();
  zoomSlider.value = initialZoom;
  applyZoom(initialZoom);
  inputText.focus();
  var KB_LAYERS = {
      abc: [
        ['q','w','e','r','t','y','u','i','o','p'],
        ['a','s','d','f','g','h','j','k','l'],
        ['SHIFT','z','x','c','v','b','n','m','BACK'],
        ['MODE',',','SPACE','.','ENTER']
      ],
      sym: [
        ['1','2','3','4','5','6','7','8','9','0'],
        ['@','#','$','%','&','-','+','(',')'],
        ['=','*','"',"'",':',';','!','?','BACK'],
        ['MODE',',','SPACE','.','ENTER']
      ]
    };
  
    function renderKeyboard() {
      kbEl.innerHTML = '';
      var layer = kbSym ? KB_LAYERS.sym : KB_LAYERS.abc;
      for (var r = 0; r < layer.length; r++) {
        var rowEl = document.createElement('div');
        rowEl.className = 'kb-row';
        for (var c = 0; c < layer[r].length; c++) {
          var k = layer[r][c];
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'kb-key';
          btn.setAttribute('data-key', k);
          if (k === 'SHIFT') {
            btn.textContent = '⇧';
            btn.className += ' kb-fn' + (kbShift ? ' kb-on' : '');
          } else if (k === 'BACK') {
            btn.textContent = '⌫';
            btn.className += ' kb-fn';
          } else if (k === 'MODE') {
            btn.textContent = kbSym ? 'ABC' : '?123';
            btn.className += ' kb-fn';
          } else if (k === 'ENTER') {
            btn.textContent = '↵';
            btn.className += ' kb-fn';
          } else if (k === 'SPACE') {
            btn.textContent = '␣';
            btn.className += ' kb-space';
          } else {
            btn.textContent = (kbShift && !kbSym) ? k.toUpperCase() : k;
          }
          rowEl.appendChild(btn);
        }
        kbEl.appendChild(rowEl);
      }
    }
  
    function kbHandle(key) {
      var t = kbTarget;
      if (!t || !t.isConnected) { t = inputText; kbTarget = t; }
      if (key === 'SHIFT') { kbShift = !kbShift; renderKeyboard(); return; }
      if (key === 'MODE') { kbSym = !kbSym; kbShift = false; renderKeyboard(); return; }
      if (document.activeElement !== t) t.focus();
      if (key === 'ENTER') {
        t.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true, cancelable: true }));
        return;
      }
      var s = t.selectionStart;
      var e2 = t.selectionEnd;
      var minPos = t.classList.contains('line-text') ? BULLET.length : 0;
      if (key === 'BACK') {
        var from = (s === e2) ? s - 1 : Math.max(s, minPos);
        if (from < minPos || from >= e2) return;
        t.setRangeText('', from, e2, 'end');
      } else {
        var ch = (key === 'SPACE') ? ' ' : ((kbShift && !kbSym) ? key.toUpperCase() : key);
        var from2 = Math.max(s, minPos);
        var to2 = Math.max(e2, from2);
        t.setRangeText(ch, from2, to2, 'end');
        if (kbShift && !kbSym) { kbShift = false; renderKeyboard(); }
      }
      t.dispatchEvent(new Event('input', { bubbles: true }));
    }
  
    function kbPress(e) {
      var btn = e.target.closest ? e.target.closest('.kb-key') : null;
      if (!btn) return;
      e.preventDefault();
      kbHandle(btn.getAttribute('data-key'));
    }
  
    var KBH_KEY = 'notes_app_kbh_v1';
      var KBH_MIN = 28;
      var KBH_MAX = 80;
      var kbDivider = document.getElementById('kbDivider');
      var kbHeight = parseInt(localStorage.getItem(KBH_KEY), 10);
      if (isNaN(kbHeight)) kbHeight = 40;
      var kbDragActive = false;
      var kbDragStartY = 0;
      var kbDragStartH = 40;
    
      function clampKbHeight(v) {
        return Math.max(KBH_MIN, Math.min(KBH_MAX, Math.round(v)));
      }
    
      function applyKbHeight(v) {
        kbHeight = clampKbHeight(v);
        document.documentElement.style.setProperty('--kb-key-h', kbHeight + 'px');
      }
    
      applyKbHeight(kbHeight);
    
      kbDivider.addEventListener('pointerdown', function (e) {
          if (e.target === zoomSlider) return;
        kbDragActive = true;
        kbDragStartY = e.clientY;
        kbDragStartH = kbHeight;
        kbDivider.classList.add('kb-dragging');
        try { kbDivider.setPointerCapture(e.pointerId); } catch (err) {}
        e.preventDefault();
      });
    
      kbDivider.addEventListener('pointermove', function (e) {
        if (!kbDragActive) return;
        applyKbHeight(kbDragStartH + (kbDragStartY - e.clientY) / 4);
      });
    
      function kbDragEnd() {
        if (!kbDragActive) return;
        kbDragActive = false;
        kbDivider.classList.remove('kb-dragging');
        localStorage.setItem(KBH_KEY, String(kbHeight));
        try {
          set(kbRef, { h: kbHeight, ts: Date.now() });
        } catch (err) {
          console.error('kb height sync failed', err);
        }
      }
    
      kbDivider.addEventListener('pointerup', kbDragEnd);
      kbDivider.addEventListener('pointercancel', kbDragEnd);
    
      onValue(kbRef, function (snap) {
        var val = snap.val();
        if (!val || typeof val.h !== 'number') return;
        if (kbDragActive) return;
        if (val.h === kbHeight) return;
        applyKbHeight(val.h);
        localStorage.setItem(KBH_KEY, String(kbHeight));
      });
    
      kbEl.addEventListener('mousedown', kbPress);
    kbEl.addEventListener('touchstart', kbPress, { passive: false });
    inputText.addEventListener('focus', function () { kbTarget = inputText; });
    kbTarget = inputText;
    renderKeyboard();
  
    listenRemote();
</script>

</body>
</html>
