<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    width: 100%;
    height: 100%;
    background: #e0e5ec;
    color: #4d5b7c;
    font-family: 'Roboto Mono', 'Courier New', monospace;
    overflow: hidden;
  }

  body {
    border: none;
    display: flex;
    flex-direction: column;
    padding: 12px;
    gap: 12px;
  }

  /* ---------- Notes area (each line in its own bordered container) ---------- */
  .notes-list {
    flex: 1 1 auto;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    display: flex;
    flex-direction: column-reverse;
    gap: 12px;
    padding: 6px;
  }

  .notes-list::-webkit-scrollbar { width: 6px; }
  .notes-list::-webkit-scrollbar-thumb { background: #babecc; border-radius: 10px; }

  .line-row {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      border: none;
      padding: 10px 14px;
      flex: 0 0 auto;
      background: #e0e5ec;
      border-radius: 12px;
      box-shadow: 6px 6px 12px #babecc, -6px -6px 12px #ffffff;
    }
  .notes-list .line-row:first-child {
    margin-bottom: 0;
  }

  .line-text {
      flex: 1 1 auto;
      min-width: 0;
      background: transparent;
      border: none;
      outline: none;
      resize: none;
      overflow: hidden;
      color: #333333;
      font-family: inherit;
      line-height: 1.4;
      font-size: clamp(11px, var(--note-font-size, 16px), 4.5vw);
      letter-spacing: 0.03em;
      padding: 2px 0;
    }

  .line-del {
    flex: 0 0 auto;
    background: #e0e5ec;
    border: none;
    color: #a3b1c6;
    font-size: 14px;
    line-height: 1;
    padding: 6px 10px;
    cursor: pointer;
    border-radius: 8px;
    box-shadow: 3px 3px 6px #babecc, -3px -3px 6px #ffffff;
  }
  .line-del:active { 
    color: #e53935;
    box-shadow: inset 2px 2px 5px #babecc, inset -2px -2px 5px #ffffff;
  }

  /* ---------- Fixed blank input row (always at bottom) ---------- */
  .input-row {
    flex: 0 0 auto;
    display: flex;
    align-items: flex-start;
    gap: 8px;
    border: none;
    padding: 12px 16px;
    background: #e0e5ec;
    border-radius: 12px;
    box-shadow: inset 5px 5px 10px #babecc, inset -5px -5px 10px #ffffff;
  }

  #inputText {
      flex: 1 1 auto;
      min-width: 0;
      background: transparent;
      border: none;
      outline: none;
      resize: none;
      overflow: hidden;
      color: #333333;
      font-family: inherit;
      line-height: 1.4;
      font-size: clamp(11px, var(--note-font-size, 16px), 4.5vw);
      letter-spacing: 0.03em;
      padding: 2px 0;
    }

  /* ---------- Bottom zoom slider ---------- */
  .zoom-bar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    border: none;
    background: #e0e5ec;
    border-radius: 12px;
    box-shadow: 6px 6px 12px #babecc, -6px -6px 12px #ffffff;
  }

  .zoom-label {
      font-size: 16px;
      color: #4d5b7c;
      width: 18px;
      flex: 0 0 auto;
      text-align: center;
      font-weight: bold;
    }
  
    .input-row > span {
        flex: 0 0 auto;
        font-size: clamp(11px, var(--note-font-size, 16px), 4.5vw);
        line-height: 1.4;
        padding: 2px 0;
        color: #4d5b7c;
      }

  input[type="range"] {
    flex: 1 1 auto;
    -webkit-appearance: none;
    appearance: none;
    height: 6px;
    background: #e0e5ec;
    outline: none;
    border-radius: 10px;
    box-shadow: inset 2px 2px 5px #babecc, inset -2px -2px 5px #ffffff;
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #e0e5ec;
    border: none;
    cursor: pointer;
    box-shadow: 3px 3px 6px #babecc, -3px -3px 6px #ffffff;
  }

  input[type="range"]::-moz-range-thumb {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #e0e5ec;
    border: none;
    cursor: pointer;
    box-shadow: 3px 3px 6px #babecc, -3px -3px 6px #ffffff;
  }

  input[type="range"]::-moz-range-track {
    height: 6px;
    background: #e0e5ec;
    border-radius: 10px;
  }
</style>
</head>
<body>

  <div class="notes-list" id="notesList"></div>

  <div class="input-row">
    <span>•</span>
    <textarea id="inputText" rows="1" placeholder=""></textarea>
  </div>

  <div class="zoom-bar">
    <span class="zoom-label">−</span>
    <input type="range" id="zoomSlider" min="12" max="36" value="16" step="1">
    <span class="zoom-label">+</span>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAYHA8Qw3Qw3Qzbyg8MtjrSKcJusNi4VaA6V4",
    authDomain: "system-data-bf026.firebaseapp.com",
    databaseURL: "https://system-data-bf026-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "system-data-bf026",
    storageBucket: "system-data-bf026.firebasestorage.app",
    messagingSenderId: "718302899022",
    appId: "1:718302899022:web:f1675dbcc293e138c68c1f"
  };
  const fbApp = initializeApp(firebaseConfig);
  const db = getDatabase(fbApp);
  const NOTES_ID = "notes_1";
  const notesRef = ref(db, `textNotes/${NOTES_ID}`);

  const STORAGE_KEY = 'notes_app_data_v1';
  const ZOOM_KEY = 'notes_app_zoom_v1';
  const BULLET = '•\u00A0';

  const notesList = document.getElementById('notesList');
  const inputText = document.getElementById('inputText');
  const zoomSlider = document.getElementById('zoomSlider');

  let isRemoteUpdate = false;
    let isEditingNote = false;
    let localSaveTimeout = null;
    let remoteSyncTimeout = null;
    let lastSyncedText = null;
  
    function currentLinesFromDOM() {
      return [...notesList.querySelectorAll('.line-text')].map(r => r.value.replace(/^•\s*/, ''));
    }
  
    function loadNotesLocal() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return [];
      return raw.split('\n').filter(l => l.trim() !== '');
    }
  
    function scheduleSave() {
      clearTimeout(localSaveTimeout);
      localSaveTimeout = setTimeout(saveLocalOnly, 80);
  
      clearTimeout(remoteSyncTimeout);
      remoteSyncTimeout = setTimeout(syncRemote, 1200);
    }
  
    function saveLocalOnly() {
      const lines = currentLinesFromDOM();
      localStorage.setItem(STORAGE_KEY, lines.join('\n'));
    }
  
    function syncRemote() {
      const lines = currentLinesFromDOM();
      const text = lines.join('\n');
      if (text === lastSyncedText) return;
      lastSyncedText = text;
      try {
        set(notesRef, { lines: lines, ts: Date.now() });
      } catch (err) {
        console.error('sync failed', err);
      }
    }
  
    function listenRemote() {
      onValue(notesRef, (snap) => {
        const val = snap.val();
        if (!val || !Array.isArray(val.lines)) return;
        const incomingText = val.lines.join('\n');
        if (incomingText === lastSyncedText) return;
        lastSyncedText = incomingText;
        if (isEditingNote) return;
        const activeEl = document.activeElement;
        const isEditingInput = activeEl === inputText;
        isRemoteUpdate = true;
        renderNotes(val.lines);
        localStorage.setItem(STORAGE_KEY, val.lines.join('\n'));
        isRemoteUpdate = false;
        if (isEditingInput) inputText.focus();
      });
    }

  function loadZoom() {
    const z = localStorage.getItem(ZOOM_KEY);
    return z ? parseInt(z, 10) : 16;
  }

  function saveZoom(val) {
    localStorage.setItem(ZOOM_KEY, val);
  }

  function applyZoom(val) {
    document.documentElement.style.setProperty('--note-font-size', val + 'px');
  }

  function autoGrow(el) {
    el.style.height = 'auto';
    el.style.height = el.scrollHeight + 'px';
  }

  function createNoteRow(text) {
    const row = document.createElement('div');
    row.className = 'line-row';

    const textarea = document.createElement('textarea');
        textarea.className = 'line-text';
        textarea.value = BULLET + text.replace(/^•\s*/, '');
        textarea.rows = 1;
    
        textarea.addEventListener('focus', () => {
              isEditingNote = true;
            });
        
            textarea.addEventListener('blur', () => {
              isEditingNote = false;
              syncRemote();
            });
        
            textarea.addEventListener('input', () => {
              if (!textarea.value.startsWith(BULLET)) {
                const stripped = textarea.value.replace(/^[•\u00A0\s]*/, '');
                const caret = textarea.selectionStart;
                const removedLen = textarea.value.length - (BULLET.length + stripped.length);
                textarea.value = BULLET + stripped;
                const newCaret = Math.max(BULLET.length, caret - removedLen);
                textarea.setSelectionRange(newCaret, newCaret);
              }
              autoGrow(textarea);
              scheduleSave();
            });
        
            textarea.addEventListener('keydown', (e) => {
              const atBulletBoundary = textarea.selectionStart <= BULLET.length && textarea.selectionEnd <= BULLET.length;
              if (atBulletBoundary && (e.key === 'Backspace' || e.key === 'Delete')) {
                if (textarea.selectionStart === textarea.selectionEnd && textarea.selectionStart <= BULLET.length) {
                  e.preventDefault();
                }
              }
            });
        
            textarea.addEventListener('keydown', (e) => {
              if (e.key === 'Enter') {
                e.preventDefault();
                const newRow = createNoteRow('');
                row.insertAdjacentElement('afterend', newRow);
                const newTextarea = newRow.querySelector('.line-text');
                autoGrow(newTextarea);
                newTextarea.focus();
                scheduleSave();
              }
            });
    
        const del = document.createElement('button');
            del.className = 'line-del';
            del.textContent = '✕';
            del.addEventListener('click', () => {
              row.remove();
              scheduleSave();
            });
    
        row.appendChild(textarea);
        row.appendChild(del);
        return row;
      }

  function addNote(text) {
    if (text.trim() === '') return;
    const row = createNoteRow(text);
    notesList.appendChild(row);
    autoGrow(row.querySelector('.line-text'));
    scheduleSave();
    notesList.scrollTop = 0;
  }

  function renderNotes(lines) {
    notesList.innerHTML = '';
    lines.forEach(line => {
      const row = createNoteRow(line);
      notesList.appendChild(row);
    });
    notesList.querySelectorAll('.line-text').forEach(autoGrow);
    notesList.scrollTop = 0;
  }

  inputText.addEventListener('input', () => autoGrow(inputText));

  inputText.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      addNote(inputText.value);
      inputText.value = '';
      autoGrow(inputText);
      inputText.focus();
    }
  });

  zoomSlider.addEventListener('input', () => {
    applyZoom(zoomSlider.value);
    saveZoom(zoomSlider.value);
    notesList.querySelectorAll('.line-text').forEach(autoGrow);
    autoGrow(inputText);
  });

  // init
  renderNotes(loadNotesLocal());
  const initialZoom = loadZoom();
  zoomSlider.value = initialZoom;
  applyZoom(initialZoom);
  inputText.focus();
  listenRemote();
</script>

</body>
</html>
